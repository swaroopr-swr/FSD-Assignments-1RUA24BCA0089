<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="empty-state glass-card" style="padding: 4rem 2rem; max-width: 540px;">
      <h1 style="font-size: 3rem; color: var(--secondary);">404</h1>
      <h2>Resource Not Found</h2>
      <p>The requested user, child, or page does not exist in the database.</p>
      <div style="margin-top: 1.5rem;">
        <a href="/users" class="btn btn-primary">Return to Users</a>
      </div>
    </div>
  </div>
</body>
</html>
